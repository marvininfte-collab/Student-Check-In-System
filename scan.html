<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>掃描打卡</title>
<style>
/* 手機單欄：上方老師名字，中間大按鈕，下方最近掃描紀錄 */
:root{
  --bg:#f2f4f7; --surface:#ffffff; --ink:#15202b; --muted:#5d6b7a; --line:#dde2e8;
  --red:#e5172f; --accent:#06c755; --accent-ink:#ffffff;
  --ok:#0f7a55; --ok-bg:#e3f5ee; --bye:#1d5bd0; --bye-bg:#e4edfc;
  --warn:#9a5b00; --warn-bg:#fdf1d9; --bad:#b93226; --bad-bg:#fbe6e3;
  --font:"PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;
  --num:"SF Mono","Roboto Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#10161d; --surface:#19222c; --ink:#e9eef3; --muted:#93a1b0; --line:#2a3642;
    --ok:#5fd3a6; --ok-bg:#12372b; --bye:#8db4ff; --bye-bg:#16294a;
    --warn:#f0c064; --warn-bg:#3a2d10; --bad:#ff8a7d; --bad-bg:#40191a;
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.5;
  padding-inline:16px;padding-block:calc(14px + env(safe-area-inset-top,0px)) calc(24px + env(safe-area-inset-bottom,0px))}
[hidden]{display:none!important}
.wrap{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;border-bottom:3px solid var(--red);padding-bottom:10px}
h1{font-size:20px;margin:0}
.who{color:var(--muted);font-size:14px}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:10px 16px;min-height:48px}
button:focus-visible{outline:3px solid var(--bye);outline-offset:2px}
.scan{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-size:22px;font-weight:800;min-height:84px;border-radius:18px}
.scan:disabled{opacity:.5}
.cont{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:15px}
.cont input{width:20px;height:20px}
.result{border-radius:16px;padding:18px;text-align:center;display:flex;flex-direction:column;gap:2px}
.result.ok{background:var(--ok-bg);color:var(--ok)} .result.bye{background:var(--bye-bg);color:var(--bye)}
.result.warn{background:var(--warn-bg);color:var(--warn)} .result.bad{background:var(--bad-bg);color:var(--bad)}
.result b{font-size:15px;letter-spacing:.08em}
.result strong{font-size:34px;color:var(--ink);line-height:1.25}
.result span{font-size:17px;font-variant-numeric:tabular-nums}
.msg{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;margin:0}
.msg.err{color:var(--bad)}
h2{font-size:16px;margin:4px 0 0}
#log{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:14px}
#log li{display:flex;justify-content:space-between;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line)}
#log li:last-child{border-bottom:0}
#log time{font-family:var(--num);color:var(--muted);font-variant-numeric:tabular-nums}
.empty{color:var(--muted);padding:12px 14px}
</style>
</head>
<body>
<div class="wrap">
  <header class="top"><h1>掃描打卡</h1><span class="who" id="who">登入中…</span></header>
  <p class="msg" id="msg" hidden></p>
  <div id="main" hidden>
    <div style="display:flex;flex-direction:column;gap:12px">
      <button class="scan" id="scan">掃描學生卡</button>
      <label class="cont"><input type="checkbox" id="cont" checked>連續掃描（掃完自動開下一次）</label>
      <div class="result" id="result" hidden aria-live="assertive"><b id="rMark"></b><strong id="rName"></strong><span id="rSub"></span></div>
      <h2>這次掃描的紀錄</h2>
      <ul id="log"><li class="empty">還沒有掃描</li></ul>
    </div>
  </div>
</div>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script>
const $=id=>document.getElementById(id);
const api=new URLSearchParams(location.search).get('api')||'';
function call(action,data){
  return fetch(api,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(Object.assign({action},data||{}))}).then(r=>r.json());
}
function say(text,err){const m=$('msg');m.textContent=text;m.className='msg'+(err?' err':'');m.hidden=!text}
let token='',busy=false;
async function start(){
  if(!api){say('網址缺少系統位置，請用後台「設定」頁提供的掃描頁網址設定 LIFF。',true);$('who').textContent='';return}
  try{
    const c=await call('teacher.config');
    if(!c.liffId){say('後台還沒有填 LIFF ID。',true);$('who').textContent='';return}
    await liff.init({liffId:c.liffId});
    if(!liff.isLoggedIn()){liff.login({redirectUri:location.href});return}
    token=liff.getIDToken();
    const h=await call('teacher.hello',{idToken:token});
    if(h.relogin){liff.logout();liff.login({redirectUri:location.href});return}
    if(!h.ok){$('who').textContent=h.name||'';say(h.error+(h.pending?'。開通後重新打開這一頁即可。':''),!h.pending);return}
    $('who').textContent=h.name;say('');$('main').hidden=false;
  }catch(e){say('無法啟動：'+(e&&e.message?e.message:e),true)}
}
const log=[];
function show(kind,mark,name,sub){
  const r=$('result');r.className='result '+kind;$('rMark').textContent=mark;$('rName').textContent=name;$('rSub').textContent=sub;r.hidden=false;
  if(navigator.vibrate)navigator.vibrate(kind==='ok'||kind==='bye'?60:[60,60,60]);
}
function addLog(name,what,time){
  log.unshift({name,what,time});
  $('log').innerHTML=log.slice(0,30).map(x=>`<li><span>${x.name.replace(/</g,'&lt;')}・${x.what}</span><time>${x.time}</time></li>`).join('');
}
async function scanOnce(){
  if(busy)return;busy=true;$('scan').disabled=true;
  let code='';
  try{const r=await liff.scanCodeV2();code=(r&&r.value||'').trim()}catch(e){busy=false;$('scan').disabled=false;say('無法開啟掃描器：請確認 LIFF 設定有開啟「Scan QR」。',true);return}
  if(!code){busy=false;$('scan').disabled=false;return}   // 老師按了取消
  $('rName').textContent='處理中…';
  try{
    const j=await call('teacher.punch',{idToken:token,code});
    if(j.relogin){liff.login({redirectUri:location.href});return}
    if(!j.ok)show('bad','無法打卡',j.error||'','');
    else if(j.result==='unknown')show('bad','無法辨識','這張卡不在名單裡','');
    else if(j.result==='in'){show('ok','到班打卡成功',j.name,j.cls+'・'+j.time+' 到班');addLog(j.name,'到班',j.time)}
    else if(j.result==='out'){show('bye','下課打卡成功',j.name,j.time+' 離班');addLog(j.name,'離班',j.time)}
    else show('warn','已經打過卡',j.name,(j.in?j.in+' 到班':'')+(j.out?'・'+j.out+' 離班':''));
  }catch(e){show('bad','連線失敗','請檢查網路後再掃一次','')}
  busy=false;$('scan').disabled=false;
  if($('cont').checked)setTimeout(scanOnce,1200);
}
$('scan').onclick=scanOnce;
start();
</script>
</body>
</html>

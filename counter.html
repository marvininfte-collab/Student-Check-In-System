<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>櫃檯點名</title>
<style>
/* 版面：上方班級切換，下方大格名字，點一下就到班 */
:root{
  --bg:#f2f4f7; --surface:#ffffff; --ink:#15202b; --muted:#5d6b7a; --line:#dde2e8;
  --accent:#1d5bd0; --accent-ink:#ffffff;
  --ok:#0f7a55; --ok-bg:#e3f5ee; --bye:#1d5bd0; --bye-bg:#e4edfc;
  --warn:#9a5b00; --warn-bg:#fdf1d9; --bad:#b93226; --bad-bg:#fbe6e3;
  --font:"PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;
  --num:"SF Mono","Roboto Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#10161d; --surface:#19222c; --ink:#e9eef3; --muted:#93a1b0; --line:#2a3642;
    --accent:#6ea0ff; --accent-ink:#0b1420;
    --ok:#5fd3a6; --ok-bg:#12372b; --bye:#8db4ff; --bye-bg:#16294a;
    --warn:#f0c064; --warn-bg:#3a2d10; --bad:#ff8a7d; --bad-bg:#40191a;
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.5;
  display:flex;flex-direction:column;gap:14px;min-height:100vh;padding-inline:20px;
  padding-block:calc(16px + env(safe-area-inset-top,0px)) calc(90px + env(safe-area-inset-bottom,0px))}
[hidden]{display:none!important}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 16px;min-height:44px}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
button.quiet{min-height:36px;padding:4px 12px;font-size:14px;color:var(--muted)}
button:disabled{opacity:.45;cursor:default}
input{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 14px;width:100%;min-height:44px}

.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 20px}
.brand{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
h1{font-size:24px;margin:0;letter-spacing:.04em}
.sync{font-size:13px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:2px 10px}
.sync.off{color:var(--warn);background:var(--warn-bg);border-color:transparent}
.clock{display:flex;align-items:baseline;gap:12px;color:var(--muted)}
.clock strong{font-family:var(--num);font-size:26px;color:var(--ink);font-variant-numeric:tabular-nums}

.classes{display:flex;gap:8px;flex-wrap:wrap}
.classes button{border-radius:999px;min-height:44px;padding:6px 16px;display:flex;gap:8px;align-items:baseline}
.classes button small{font-family:var(--num);color:var(--muted);font-variant-numeric:tabular-nums}
.classes button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.classes button[aria-pressed="true"] small{color:inherit;opacity:.75}
.classes{flex-direction:column;align-items:stretch}
.crow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.classes button.today:not([aria-pressed="true"]){border-color:var(--ok)}
.classes .glabel{font-size:13px;font-weight:700;color:var(--muted);align-self:center;width:7.5em;flex:none}
@media (max-width:600px){.classes .glabel{width:100%}}
.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.tools .grow{flex:1;min-width:180px}
.legend{display:flex;gap:12px;font-size:14px;color:var(--muted);flex-wrap:wrap}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:4px;vertical-align:-1px;border:1px solid var(--line)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.kid{display:flex;flex-direction:column;align-items:flex-start;gap:2px;min-height:92px;padding:12px 14px;text-align:left;border-radius:14px;border:2px solid var(--line);background:var(--surface)}
.kid b{font-size:24px;line-height:1.2;overflow-wrap:anywhere;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.kid i{font-style:normal;font-size:19px;line-height:1.3;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.kid.out i,.kid.leave i{color:var(--muted)}
.kid span{margin-top:auto}
.kid span{font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.kid.in{background:var(--ok-bg);border-color:var(--ok)} .kid.in span{color:var(--ok);font-weight:600}
.kid.out{background:var(--bye-bg);border-color:transparent} .kid.out b{color:var(--muted);font-weight:500} .kid.out span{color:var(--bye)}
.kid.flash{animation:pop .35s ease-out}
@keyframes pop{0%{transform:scale(.94)}100%{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){.kid.flash{animation:none}}
.empty{color:var(--muted);margin:0}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));
  display:flex;align-items:center;gap:14px;background:var(--ink);color:var(--bg);border-radius:14px;padding:10px 10px 10px 18px;
  box-shadow:0 8px 30px rgba(0,0,0,.25);max-width:calc(100vw - 32px);font-size:17px}
.toast button{background:transparent;color:inherit;border-color:currentColor;min-height:40px}

dialog{border:1px solid var(--line);border-radius:16px;background:var(--surface);color:var(--ink);padding:20px;width:min(440px,calc(100vw - 32px))}
dialog::backdrop{background:rgba(0,0,0,.45)}
.sheet{display:flex;flex-direction:column;gap:10px}
.sheet h2{margin:0;font-size:22px}
.sheet p{margin:0;color:var(--muted)}
.sheet button{min-height:54px;font-size:18px}
.sheet .bye{background:var(--bye-bg);color:var(--bye);border-color:transparent;font-weight:700}
.form{display:flex;flex-direction:column;gap:12px}
.form label{display:flex;flex-direction:column;gap:4px;font-size:14px;color:var(--muted)}
.err{color:var(--bad);margin:0;min-height:1.5em}
.links{margin:0;text-align:center;font-size:15px}
.links a{color:var(--accent);padding:8px 6px;display:inline-block}

.modes{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{min-height:52px;padding:8px 20px;font-size:18px;font-weight:700;border-width:2px}
.seg button[aria-pressed="true"].m-in{background:var(--ok);border-color:var(--ok);color:#fff}
.seg button[aria-pressed="true"].m-late{background:var(--warn);border-color:var(--warn);color:#fff}
.seg button[aria-pressed="true"].m-out{background:var(--bye);border-color:var(--bye);color:#fff}
.seg button[aria-pressed="true"].m-leave{background:var(--muted);border-color:var(--muted);color:#fff}
.bulk{display:flex;gap:8px;margin-left:auto;flex-wrap:wrap}
.bulk button{min-height:52px;font-weight:600}
.bulk button.armed{background:var(--warn-bg);border-color:var(--warn);color:var(--warn)}
.summary{display:flex;gap:6px 16px;flex-wrap:wrap;color:var(--muted);font-size:15px}
.summary b{color:var(--ink);font-family:var(--num);font-variant-numeric:tabular-nums;margin-right:3px}
.kid.leave{background:transparent;border-style:dashed} .kid.leave b{color:var(--muted)}
.tag{display:inline-block;font-size:12px;font-weight:700;border-radius:6px;padding:0 6px;margin-left:4px;color:var(--warn);background:var(--warn-bg)}
.auto{font-size:13px;color:var(--muted)}
</style>
</head>
<body>
<header class="top">
  <div class="brand"><h1>櫃檯點名</h1><span class="sync" id="sync">尚未連線</span></div>
  <div class="clock"><span id="date"></span><strong id="clock"></strong><button class="quiet" id="openSetup">設定</button></div>
</header>

<nav class="classes" id="classes" aria-label="班級"></nav>

<div class="modes">
  <div class="seg" role="group" aria-label="點名方式">
    <button class="m-in" data-mode="in" aria-pressed="true">到班</button>
    <button class="m-late" data-mode="late" aria-pressed="false">遲到</button>
    <button class="m-out" data-mode="out" aria-pressed="false">離班</button>
    <button class="m-leave" data-mode="leave" aria-pressed="false">請假</button>
  </div>
  <div class="bulk">
    <button id="allIn">全班到班</button>
    <button id="allOut">全班離班</button>
  </div>
</div>

<div class="tools">
  <div class="grow"><input id="q" placeholder="搜尋姓名" autocomplete="off" aria-label="搜尋姓名"></div>
  <div class="summary" id="summary"></div>
</div>
<p class="empty" id="hint"></p>
<main class="grid" id="grid"></main>
<p class="empty" id="none" hidden>這個班級沒有學生。</p>
<p class="auto" id="autoInfo"></p>

<div class="toast" id="toast" hidden role="status"><span id="toastText"></span><button id="undo">復原</button></div>

<dialog id="act">
  <div class="sheet">
    <h2 id="actName"></h2>
    <p id="actInfo"></p>
    <button id="actDo"></button>
    <button id="actClose">關閉</button>
  </div>
</dialog>

<dialog id="setup">
  <form class="form" id="setupForm">
    <h2>連線設定</h2>
    <label>系統網址（Apps Script 部署後的網址）<input id="cfgUrl" inputmode="url" autocomplete="off" placeholder="https://script.google.com/macros/s/…/exec"></label>
    <label>打卡機密碼<input id="cfgPw" autocomplete="off"></label>
    <p class="err" id="setupErr"></p>
    <button class="primary" id="setupSave">連線</button>
    <button type="button" id="setupCancel">取消</button>
    <p class="links"><a href="admin.html">開啟後台</a>　<a href="./">門口打卡</a></p>
  </form>
</dialog>

<script>
const $=id=>document.getElementById(id);
const pad=n=>String(n).padStart(2,'0');
const hm=t=>{const d=new Date(t);return pad(d.getHours())+':'+pad(d.getMinutes())};
const ymd=()=>{const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
const LS={
  get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
};

let cfg=LS.get('ck-kiosk',null);              // 和打卡機共用連線設定
let roster=LS.get('ct-roster',[]),classes=LS.get('ct-classes',[]);
let cur=LS.get('ct-class',''),mode='in';
let day=ymd();
let saved=LS.get('ct-recs2',{day:'',map:{},leaves:{}});
let recs=saved.day===day?saved.map:{},leaves=saved.day===day?saved.leaves:{};
let queue=LS.get('ct-queue',[]);
let online=false,syncing=false;
const keep=()=>{LS.set('ct-recs2',{day,map:recs,leaves});LS.set('ct-queue',queue)};
const byId=()=>{const m={};roster.forEach(s=>m[s.id]=s);return m};
// 名單排序：英文名 A→Z，沒有英文名的排在後面依中文排
const nameCmp=(a,b)=>{const ea=/^[A-Za-z]/.test(a.name),eb=/^[A-Za-z]/.test(b.name);return (eb-ea)||a.name.localeCompare(b.name,'zh-Hant',{numeric:true,sensitivity:'base'})};
const clsOf=s=>s.classes||[s.cls];
const clsInfo=()=>{const m={};classes.forEach(c=>m[c.name]=c);return m};

function api(action,data,c){
  c=c||cfg;
  return fetch(c.url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},
    body:JSON.stringify(Object.assign({action,pw:c.pw},data||{}))})
    .then(r=>r.json()).then(j=>{if(!j.ok)throw new Error(j.error||'連線失敗');return j});
}
function toMs(t){if(!t)return 0;const p=t.split(':'),d=new Date();d.setHours(+p[0],+p[1],0,0);return d.getTime()}
function applyLocal(ev){
  if(ev.type==='leave'){leaves[ev.id]=true;return}
  if(ev.type==='unleave'){delete leaves[ev.id];return}
  const r=recs[ev.id]||(recs[ev.id]={});
  if(ev.type==='in'){if(!r.in){r.in=ev.t;r.late=!!ev.late}}
  else if(ev.type==='out'){if(!r.out)r.out=ev.t}
  else if(ev.type==='undoIn'){delete recs[ev.id]}
  else if(ev.type==='undoOut'){r.out=0}
}
async function sync(){
  if(!cfg||syncing)return;
  syncing=true;const sending=queue.slice();
  try{
    const j=await api('kiosk.sync',{events:sending});
    queue=queue.slice(sending.length);
    roster=j.students;classes=j.classes||[];
    LS.set('ct-roster',roster);LS.set('ct-classes',classes);
    if(j.date===ymd()){
      day=j.date;recs={};leaves={};
      j.records.forEach(r=>{recs[r.id]={in:toMs(r.in),out:toMs(r.out),late:r.note==='遲到',auto:r.outHow==='自動'}});
      (j.leaves||[]).forEach(id=>{leaves[id]=true});
      queue.forEach(applyLocal);
    }
    online=true;
  }catch(e){online=false}
  syncing=false;keep();render();renderSync();
}
function renderSync(){
  const el=$('sync');
  if(!cfg){el.textContent='尚未連線';el.className='sync off';return}
  if(queue.length){el.textContent=(online?'上傳中':'連線中斷')+'，'+queue.length+' 筆待上傳';el.className='sync off'}
  else if(online){el.textContent='已同步';el.className='sync'}
  else{el.textContent='連線中斷，紀錄會稍後補傳';el.className='sync off'}
}
function renderClock(){
  const d=new Date(),w='日一二三四五六'[d.getDay()];
  $('date').textContent=(d.getMonth()+1)+' 月 '+d.getDate()+' 日（'+w+'）';
  $('clock').textContent=pad(d.getHours())+':'+pad(d.getMinutes());
  if(ymd()!==day){day=ymd();recs={};leaves={};keep();render()}
}

// 「Amy 林語晨」拆成英文名和中文名兩行；沒有英文名就只顯示中文
function splitName(name){
  const m=String(name).trim().match(/^([A-Za-z][A-Za-z0-9.'’\- ]*?)\s*([\u3400-\u9fff].*)$/);
  return m?[m[1].trim(),m[2].trim()]:['',String(name).trim()];
}
// 學生目前狀態：none 未到、in 在班、out 已離班、leave 請假
function state(id){const r=recs[id]||{};return r.out?'out':r.in?'in':leaves[id]?'leave':'none'}
const slotOf=(c,day)=>c&&c.days&&c.days.includes(day)?((c.times&&c.times[day])||{start:c.start,end:c.end}):null;
const WD=()=>'日一二三四五六'[new Date().getDay()];
function isLate(s){const r=recs[s.id]||{},c=slotOf(clsInfo()[s.today||clsOf(s)[0]],WD());return !!r.in&&(r.late||(!!c&&!!c.start&&hm(r.in)>c.start))}

// 班級系列：依班名判斷，順序就是顯示順序
const CLS_RULES=[['MJ班級',/^\s*MJ/i],['TJ班級',/^\s*TJ/i],['國中實力養成班',/實力養成/],['國中菁英班',/菁英/],['BM班級',/^\s*BM/i],['英檢班',/英檢|GEPT/i]];
const CLS_GROUPS=CLS_RULES.map(r=>r[0]).concat('其他');
const clsGroup=n=>{const r=CLS_RULES.find(r=>r[1].test(n));return r?r[0]:'其他'};
const clsCmp=(a,b)=>(CLS_GROUPS.indexOf(clsGroup(a))-CLS_GROUPS.indexOf(clsGroup(b)))||a.localeCompare(b,'zh-Hant',{numeric:true,sensitivity:'base'});
const hasToday=n=>{const c=clsInfo()[n];return !!(c&&c.days&&c.days.includes('日一二三四五六'[new Date().getDay()]))};
function classOrder(){return [...new Set(roster.flatMap(clsOf))].sort(clsCmp)}
const HINT={in:'點名字登記到班。',late:'點名字登記到班，並標記遲到。',out:'點在班學生的名字登記離班。',leave:'點名字登記請假，再點一次取消請假。'};
function render(){
  const order=classOrder();
  if(!order.includes(cur))cur=order.find(hasToday)||order[0]||'';
  const nav=$('classes');nav.textContent='';
  let row=null,lastG='';
  order.forEach(c=>{
    if(clsGroup(c)!==lastG){lastG=clsGroup(c);row=document.createElement('div');row.className='crow';
      const h=document.createElement('span');h.className='glabel';h.textContent=lastG;row.appendChild(h);nav.appendChild(row)}
    const list=roster.filter(s=>clsOf(s).includes(c)),here=list.filter(s=>recs[s.id]&&recs[s.id].in).length;
    const b=document.createElement('button');b.setAttribute('aria-pressed',c===cur);if(hasToday(c))b.classList.add('today');
    const t=document.createElement('span');t.textContent=c;
    const n=document.createElement('small');n.textContent=here+'/'+list.length;
    b.append(t,n);b.onclick=()=>{cur=c;LS.set('ct-class',cur);$('q').value='';disarm();render()};row.appendChild(b);
  });
  document.querySelectorAll('.seg button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.mode===mode));
  $('hint').textContent=HINT[mode];
  const q=$('q').value.trim();
  const list=roster.filter(s=>q?s.name.includes(q):clsOf(s).includes(cur)).sort(nameCmp);
  const g=$('grid');g.textContent='';
  list.forEach(s=>{
    const r=recs[s.id]||{},st=state(s.id),b=document.createElement('button');
    b.className='kid'+(st==='none'?'':' '+st);b.dataset.id=s.id;
    const [en,zh]=splitName(s.name);
    const n=document.createElement('b');n.textContent=en||zh;
    const L=(en||zh).length*(en?1:1.8);if(L>9)n.style.fontSize=L>12?'16px':'19px';   // 長名字縮小字級，不截斷
    if(en&&zh){const z=document.createElement('i');z.textContent=zh;b.append(n,z)}else b.append(n);
    const t=document.createElement('span');
    t.textContent=st==='out'?hm(r.in||r.out)+' → '+hm(r.out)+(r.auto?' 自動':''):st==='in'?hm(r.in)+' 到班':st==='leave'?'請假':(q?s.cls+'・':'')+'未到';
    if(isLate(s)){const g2=document.createElement('em');g2.className='tag';g2.textContent='遲到';g2.style.fontStyle='normal';t.appendChild(g2)}
    b.append(t);g.appendChild(b);
  });
  $('none').hidden=list.length>0||!roster.length;
  $('none').textContent=q?'找不到「'+q+'」。':'這個班級沒有學生。';
  const cl=roster.filter(s=>clsOf(s).includes(cur)),cnt={none:0,in:0,out:0,leave:0};cl.forEach(s=>cnt[state(s.id)]++);
  const late=cl.filter(isLate).length;
  $('summary').innerHTML=`<span><b>${cnt.in}</b>在班</span><span><b>${cnt.out}</b>已離班</span><span><b>${late}</b>遲到</span><span><b>${cnt.leave}</b>請假</span><span><b>${cnt.none}</b>未到</span>`;
  const c=clsInfo()[cur];
  const ts=slotOf(c,WD());
  $('autoInfo').textContent=ts&&ts.end?cur+' 今天下課時間 '+ts.end+'，還沒離班的學生會由系統自動登記離班（依後台設定）。':'';
}

// 點名動作
let toastTimer=null,lastUndo=null;
function toast(text,undo){
  lastUndo=undo&&undo.length?undo:null;$('toastText').textContent=text;$('undo').hidden=!lastUndo;$('toast').hidden=false;
  clearTimeout(toastTimer);toastTimer=setTimeout(()=>{$('toast').hidden=true;lastUndo=null},5000);
}
function push(evs){
  const t=Date.now();evs.forEach(ev=>{ev.t=ev.t||t;applyLocal(ev);queue.push(ev)});
  keep();render();renderSync();sync();
}
const UNDO={in:'undoIn',out:'undoOut',leave:'unleave',unleave:'leave'};
function undoOf(evs){return evs.slice().reverse().map(ev=>({id:ev.id,type:UNDO[ev.type]}))}
function bump(id){const el=$('grid').querySelector('[data-id="'+id+'"]');if(el)el.classList.add('flash')}

$('grid').onclick=e=>{
  const b=e.target.closest('.kid');if(!b)return;
  const id=b.dataset.id,s=byId()[id],st=state(id),now=hm(Date.now());
  let evs=null,msg='';
  if(mode==='in'||mode==='late'){
    const late=mode==='late';
    if(st==='none'||st==='leave'){
      evs=(st==='leave'?[{id,type:'unleave'}]:[]).concat([{id,type:'in',manual:true,how:'櫃檯',late}]);
      msg=s.name+' 到班 '+now+(late?'（遲到）':'');
    }else if(st==='in')return openAct(s,'取消到班（按錯了）',[{id,type:'undoIn'}]);
    else return toast(s.name+' 已經離班了',null);
  }else if(mode==='out'){
    if(st==='in'){evs=[{id,type:'out',manual:true,how:'櫃檯'}];msg=s.name+' 離班 '+now}
    else if(st==='out')return openAct(s,'取消離班（按錯了）',[{id,type:'undoOut'}]);
    else return toast(s.name+(st==='leave'?' 今天請假':' 還沒到班'),null);
  }else if(mode==='leave'){
    if(st==='none'){evs=[{id,type:'leave'}];msg=s.name+' 已登記請假'}
    else if(st==='leave'){evs=[{id,type:'unleave'}];msg=s.name+' 已取消請假'}
    else return toast(s.name+' 已經到班，不能請假',null);
  }
  push(evs);bump(id);toast(msg,undoOf(evs));
};
$('undo').onclick=()=>{
  if(!lastUndo)return;const evs=lastUndo;push(evs);toast('已復原',null);
};

// 全班到班／全班離班：按一次後 3 秒內再按一次才執行
let armedBtn=null,armTimer=null;
function disarm(){if(armedBtn){armedBtn.classList.remove('armed');armedBtn.textContent=armedBtn.dataset.label;armedBtn=null}clearTimeout(armTimer)}
function bulk(btn,kind){
  const cl=roster.filter(s=>clsOf(s).includes(cur));
  const targets=kind==='in'?cl.filter(s=>state(s.id)==='none'):cl.filter(s=>state(s.id)==='in');
  if(!targets.length){disarm();return toast(kind==='in'?cur+' 沒有未到的學生':cur+' 沒有在班的學生',null)}
  if(armedBtn!==btn){
    disarm();armedBtn=btn;btn.dataset.label=btn.dataset.label||btn.textContent;
    btn.classList.add('armed');btn.textContent='再按一次：'+targets.length+' 人'+(kind==='in'?'到班':'離班');
    armTimer=setTimeout(disarm,3000);return;
  }
  disarm();
  const evs=targets.map(s=>({id:s.id,type:kind,manual:true,how:'櫃檯'}));
  push(evs);toast(cur+' '+targets.length+' 人'+(kind==='in'?'到班':'離班')+' '+hm(Date.now()),undoOf(evs));
}
$('allIn').onclick=e=>bulk(e.currentTarget,'in');
$('allOut').onclick=e=>bulk(e.currentTarget,'out');

document.querySelector('.seg').onclick=e=>{const b=e.target.closest('button');if(!b)return;mode=b.dataset.mode;disarm();render()};

const act=$('act');let actEvs=null;
function openAct(s,label,evs){
  const r=recs[s.id]||{};actEvs=evs;
  $('actName').textContent=s.name+'（'+s.cls+'）';
  $('actInfo').textContent=(r.in?hm(r.in)+' 到班':'')+(r.out?'・'+hm(r.out)+' 離班':'・在班中');
  $('actDo').textContent=label;act.showModal();
}
$('actDo').onclick=()=>{act.close();if(actEvs){push(actEvs);toast('已修改',null)}};
$('actClose').onclick=()=>act.close();
$('q').oninput=render;

// 連線設定
const setup=$('setup');
function openSetup(){
  $('cfgUrl').value=cfg?cfg.url:'';$('cfgPw').value=cfg?cfg.pw:'';$('setupErr').textContent='';
  $('setupCancel').hidden=!cfg;setup.showModal();
}
$('openSetup').onclick=openSetup;
$('setupCancel').onclick=()=>setup.close();
setup.addEventListener('cancel',e=>{if(!cfg)e.preventDefault()});
$('setupForm').onsubmit=async e=>{
  e.preventDefault();
  const c={url:$('cfgUrl').value.trim(),pw:$('cfgPw').value.trim()};
  if(!/^https?:\/\//.test(c.url)||!c.pw){$('setupErr').textContent='請填入網址和打卡機密碼';return}
  $('setupSave').disabled=true;$('setupErr').textContent='連線中…';
  try{await api('kiosk.sync',{events:[]},c);cfg=c;LS.set('ck-kiosk',cfg);setup.close();sync()}
  catch(err){$('setupErr').textContent=err.name==='TypeError'?'連不上系統，請檢查網址和網路':err.message}
  $('setupSave').disabled=false;
};
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')sync()});

renderClock();setInterval(renderClock,5000);
render();renderSync();
if(cfg)sync();else openSetup();
setInterval(sync,30000);
setInterval(()=>{if(queue.length)sync()},8000);
</script>
